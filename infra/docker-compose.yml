services:

  postgres:
    image: postgres:17-alpine
    container_name: meter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meter_tracking_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meter-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  backend:
    build:
      context: ./meter-tracking-backend
      dockerfile: Dockerfile
    container_name: meter-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-meter_tracking_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ONEC_SERVER: ${ONEC_SERVER:-localhost}
      ONEC_ENABLED: ${ONEC_ENABLED:-false}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_TAGS_APPLICATION: meter-tracking-app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meter-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.0"
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./meter-tracking-frontend-dev
      dockerfile: Dockerfile
    container_name: meter-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - meter-network
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.25"
        reservations:
          memory: 16M

  prometheus:
    image: prom/prometheus:latest
    container_name: meter-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - meter-network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: meter-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - meter-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  meter-network:
    driver: bridge
